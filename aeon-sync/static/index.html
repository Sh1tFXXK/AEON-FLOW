<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEON Capture</title>
<style>
:root{
  color-scheme:dark;
  --bg:#10110f;
  --panel:#171914;
  --panel-2:#20231b;
  --panel-3:#262a21;
  --line:#34372c;
  --text:#f2f0e7;
  --muted:#aaa694;
  --green:#93d977;
  --gold:#e3bb63;
  --cyan:#7fc7c3;
  --blue:#7bb8ff;
  --violet:#bb9cff;
  --red:#ef8b82;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,sans-serif;letter-spacing:0}
button,input,textarea{font:inherit}
button{cursor:pointer}
.top{height:56px;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--line);background:#12140f}
.brand{font-weight:750;white-space:nowrap}.identity{color:var(--muted);font-size:13px;margin-left:auto}
.iconBtn{height:34px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px;padding:0 12px;cursor:pointer}
.iconBtn:disabled{opacity:.5;cursor:default}
.iconBtn.primary{background:var(--gold);border-color:var(--gold);color:#171101}
.tabs{height:100%;display:flex;align-items:center;gap:4px;padding:0;background:transparent}
.tab{height:36px;padding:0 14px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted)}
.tab.active{color:var(--green);border-color:var(--green);background:#14180f}
.tabContent{display:none;height:calc(100vh - 56px);min-height:0}
.tabContent.active{display:block}
.shell{display:grid;grid-template-columns:minmax(300px,420px) 1fr;height:100%;min-height:0}
.streamPane{border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.detailPane{min-width:0;display:flex;flex-direction:column}
.filter{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:10px;background:var(--panel)}
.search{width:100%;height:38px;border:1px solid var(--line);background:#0d0e0b;color:var(--text);padding:0 12px;border-radius:6px}
.search:focus,.editor:focus{outline:1px solid var(--green);outline-offset:0}
.pills{display:flex;gap:8px;overflow:auto;padding-bottom:2px}
.pill{height:30px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:0 12px;white-space:nowrap}
.pill.active{color:#0d120b;background:var(--green);border-color:var(--green)}
.stream{overflow:auto;min-height:0}
.entry{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:14px;border-bottom:1px solid #292c23;cursor:pointer;min-width:0}
.entry:hover,.entry.active{background:var(--panel-2)}
.time{font-size:12px;color:var(--muted);white-space:nowrap}
.entryBody{min-width:0}.entryTitle{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summary{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.source{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--muted);font-size:12px;min-width:0}
.badge{height:22px;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--cyan);white-space:nowrap}
.detailHead{padding:18px 20px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:14px;background:#12140f}
.detailTitle{font-size:20px;font-weight:750;overflow-wrap:anywhere}.detailMeta{color:var(--muted);font-size:13px;margin-top:6px}
.actions{display:flex;gap:8px;align-items:start;flex-wrap:wrap}.detailBody{overflow:auto;min-height:0;padding:20px}
.empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;padding:18px}
.previewText{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:#0b0c09;border:1px solid var(--line);border-radius:6px;padding:14px;line-height:1.55;min-height:220px}
.previewImage{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#0b0c09}
.metaGrid{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;margin-top:16px;color:var(--muted);font-size:13px}
.metaGrid div:nth-child(odd){color:#c8c3ad}.cid{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere;color:var(--green)}
.editor{width:100%;min-height:360px;resize:vertical;border:1px solid var(--line);border-radius:6px;background:#0b0c09;color:var(--text);padding:14px;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}
.processPage{height:100%;display:flex;flex-direction:column;min-height:0}
.processToolbar{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:#12140f}
.processList{overflow:auto;min-height:0}
.procGroup{border-bottom:1px solid var(--line)}
.procGroupTitle{padding:10px 16px 6px;font-size:12px;letter-spacing:.02em;font-weight:700;color:var(--muted)}
.procGroup summary{list-style:none}.procGroup summary::-webkit-details-marker{display:none}
.procItem{padding:12px 16px;border-top:1px solid #292c23;background:transparent}
.procItem:hover{background:var(--panel-2)}
.procMain{display:flex;align-items:flex-start;gap:12px;min-width:0}
.procIcon{width:28px;height:28px;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.procInfo{min-width:0;flex:1}.procName{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.procExe{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.procStats{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:5px}
.cpuTrack{width:48px;height:5px;border-radius:999px;background:#0d0e0b;display:inline-flex;vertical-align:middle;margin-right:5px;overflow:hidden}
.cpuBar{height:100%;background:var(--green);border-radius:999px}
.procActions{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0 40px}
.captureBtn{min-height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);padding:4px 9px;font-size:12px}
.btnDeep{background:#142642;border-color:#274b83;color:var(--blue)}
.btnScreenshot{background:#183016;border-color:#2c6428;color:#9df28a}
.btnMigrate{background:#2b2044;border-color:#57448e;color:var(--violet)}
.btnPause{background:#3a2b18;border-color:#82612b;color:#ffc36d}
.btnSnapshot{background:#183638;border-color:#2f7478;color:#86ffff}
.btnMeta{background:#242424;border-color:#4a4a4a;color:#c8c8c8}
.procResult{margin:8px 0 0 40px;font-size:12px;color:var(--muted)}
.captureSuccess{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--green)}
.captureError{color:var(--red)}
.devicesPage{padding:18px;max-width:760px}
.deviceRow{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0;gap:14px;min-width:0}
.deviceRow>div{min-width:0}
.connectBlock{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin:12px 0 18px;overflow:hidden}
.connectBlock .procGroupTitle{padding:10px 12px;border-bottom:1px solid var(--line)}
.connectRow{display:grid;grid-template-columns:minmax(180px,220px) minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid #292c23;min-width:0}
.connectRow:first-child{border-top:0}
.connectRow .badge{min-width:0;width:100%;justify-content:flex-start;overflow:hidden;text-overflow:ellipsis}
.connectUrl{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--green);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.connectHint{color:var(--muted);font-size:12px;margin:0 0 10px}
.dropOverlay{position:fixed;inset:0;background:rgba(16,17,15,.88);display:none;place-items:center;z-index:8;border:2px dashed var(--green);color:var(--green);font-size:22px;font-weight:750}
.dropOverlay.show{display:grid}
.toast{position:fixed;right:18px;bottom:18px;z-index:9;max-width:min(420px,calc(100vw - 36px));padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:#202319;color:var(--text);box-shadow:0 14px 40px rgba(0,0,0,.28);display:none}
.toast.show{display:block}
.modal{position:fixed;inset:0;background:rgba(10,11,9,.72);z-index:10;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}.modalPanel{width:min(760px,100%);max-height:min(760px,calc(100vh - 40px));display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:0 20px 70px rgba(0,0,0,.38);min-height:0}
.modalHead{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line)}.modalTitle{font-weight:750}.modalHead .search{flex:1}
@media (max-width:820px){
  .top{gap:8px;padding:0 12px}.identity{font-size:12px}.brand{font-size:14px}.tab{padding:0 10px}
  .processToolbar{grid-template-columns:1fr auto}.processToolbar .secondaryRefresh{display:none}
  .shell{grid-template-columns:1fr}.detailPane{display:none}.detailPane.open{display:flex;position:fixed;inset:56px 0 0;background:var(--bg);z-index:2}.streamPane.detailOpen{display:none}
  .detailHead{grid-template-columns:1fr}.procActions,.procResult{margin-left:0}.metaGrid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="top">
  <div class="brand">AEON Capture</div>
  <nav class="tabs">
    <button class="tab active" data-tab="stream">捕获流</button>
    <button class="tab" data-tab="processes">进程面板</button>
    <button class="tab" data-tab="devices">设备</button>
  </nav>
  <div class="identity" id="identity"></div>
</div>

<section class="tabContent active" id="tab-stream">
  <main class="shell">
    <section class="streamPane" id="streamPane">
      <div class="filter">
        <input class="search" id="search" placeholder="搜索捕获内容">
        <div class="pills" id="pills">
          <button class="pill active" data-kind="all">全部</button>
          <button class="pill" data-kind="Conversation">对话</button>
          <button class="pill" data-kind="Code">代码</button>
          <button class="pill" data-kind="Image">图片</button>
          <button class="pill" data-kind="ProcessState">进程</button>
          <button class="pill" data-kind="VmSnapshot">VM 快照</button>
          <button class="pill" data-kind="Clipboard">剪贴板</button>
        </div>
      </div>
      <div class="stream" id="stream"></div>
    </section>
    <section class="detailPane" id="detailPane">
      <div class="empty" id="empty">选择一条捕获</div>
      <div id="detail" style="display:none;height:100%;min-height:0;flex-direction:column"></div>
    </section>
  </main>
</section>

<section class="tabContent" id="tab-processes">
  <div class="processPage">
    <div class="processToolbar">
      <input class="search" id="procSearch" placeholder="搜索进程、PID、路径">
      <button class="iconBtn secondaryRefresh" onclick="loadProcesses()">刷新</button>
      <button class="iconBtn" onclick="captureProcesses()">捕获进程清单</button>
      <button class="iconBtn primary" onclick="captureAll()">捕获全机状态</button>
    </div>
    <div class="processList" id="processList"></div>
  </div>
</section>

<section class="tabContent" id="tab-devices">
  <div class="devicesPage">
    <h2>设备</h2>
    <div class="connectHint">Android 端会通过 AEON LAN Discovery 自动找到桌面；跨网络时使用自研 AEON Relay。</div>
    <div class="connectBlock">
      <div class="procGroupTitle">连接地址</div>
      <div id="connectList"></div>
    </div>
    <div id="deviceList" class="processList"></div>
  </div>
</section>

<div class="dropOverlay" id="dropOverlay">松开以捕获</div>
<div class="toast" id="toast"></div>
<div class="modal" id="vmModal" onclick="if(event.target===vmModal)closeVmPicker()">
  <div class="modalPanel">
    <div class="modalHead">
      <div class="modalTitle">捕获 AEON VM</div>
      <input class="search" id="vmSearch" placeholder="搜索 VM、状态或程序">
      <button class="iconBtn" onclick="closeVmPicker()">关闭</button>
    </div>
    <div class="processList" id="vmList"></div>
  </div>
</div>
<script>
let entries=[],activeKind='all',currentCid=null,activeDetail=null,allProcesses=[],vms=[],devices=[],connectUrls=[];
let toastTimer=null;
const esc=s=>(s===null||s===undefined?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtTime=ms=>{const d=Date.now()-ms;if(d<60000)return'刚刚';if(d<3600000)return`${Math.floor(d/60000)}分钟前`;if(d<86400000)return`${Math.floor(d/3600000)}小时前`;return new Date(ms).toLocaleString();};
const compact=s=>s&&s.length>140?s.slice(0,140)+'...':s||'';
const humanMem=mb=>mb>=1024?(mb/1024).toFixed(1)+' GB':mb+' MB';

async function refreshStatus(){
  const s=await fetch('/api/status').then(r=>r.json());
  devices=s.devices||[];
  connectUrls=s.connect_urls||[];
  identity.textContent=s.identity_short?`ID ${s.identity_short}`:'';
  renderDevices();
}
async function refreshEntries(){entries=await fetch('/api/entries').then(r=>r.json());renderStream();}
function showToast(message){clearTimeout(toastTimer);toast.textContent=message;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),3800);}
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.querySelectorAll('.tabContent').forEach(c=>c.classList.toggle('active',c.id===`tab-${name}`));
  if(name==='processes')loadProcesses();
  if(name==='devices')refreshStatus();
}
document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>switchTab(tab.dataset.tab));

function setActiveKind(kind){activeKind=kind;document.querySelectorAll('.pill').forEach(x=>x.classList.toggle('active',x.dataset.kind===kind));renderStream();}
function filteredEntries(){const q=search.value.trim().toLowerCase();return entries.filter(e=>(activeKind==='all'||e.kind===activeKind)&&(!q||[e.title,e.summary,e.source_label,e.cid,...Object.values(e.extra||{})].some(v=>(v||'').toLowerCase().includes(q))));}
function renderStream(){const list=filteredEntries();stream.innerHTML=list.map(e=>`
  <div class="entry ${currentCid===e.cid?'active':''}" onclick="openEntry('${e.cid}')">
    <div class="time">${fmtTime(e.captured_at)}</div>
    <div class="entryBody">
      <div class="entryTitle">${esc(e.title)}</div>
      <div class="summary">${esc(compact(e.summary))}</div>
      <div class="source"><span class="badge">${esc(e.kind_label)}</span><span>${esc(e.source_label)}</span></div>
    </div>
  </div>`).join('')||'<div class="empty" style="height:180px">暂无捕获</div>';}
async function openEntry(cid){currentCid=cid;renderStream();const d=await fetch(`/api/entry/${cid}`).then(r=>r.json());activeDetail=d;empty.style.display='none';detail.style.display='flex';detailPane.classList.add('open');streamPane.classList.add('detailOpen');
  const canContinue=['Conversation','Code','Text','Clipboard','Webpage'].includes(d.kind);
  const canEdit=d.editable&&d.text!==null;
  detail.innerHTML=`
    <div class="detailHead">
      <div><div class="detailTitle">${esc(d.title)}</div><div class="detailMeta">${esc(d.kind_label)} · ${esc(d.source_label)} · ${fmtTime(d.captured_at)}</div></div>
      <div class="actions"><button class="iconBtn" onclick="closeDetail()">返回</button><button class="iconBtn primary" ${canContinue?'':'disabled'} onclick="continueEntry('${d.cid}')">继续</button><button class="iconBtn" ${canEdit?'':'disabled'} onclick="startEdit()">编辑</button><button class="iconBtn" onclick="downloadEntry('${d.cid}')">打开原始内容</button></div>
    </div>
    <div class="detailBody">${renderPreview(d)}${renderMeta(d)}</div>`;}
function renderPreview(d){if(d.kind==='Image')return`<img class="previewImage" src="${d.raw_url}" alt="">`;if(d.kind==='VmSnapshot')return`<pre class="previewText">${esc(d.summary||d.title)}

${esc(Object.entries(d.extra||{}).map(([k,v])=>`${k}: ${v}`).join('\n'))}</pre>`;if(d.text)return`<pre class="previewText">${esc(d.text)}</pre>`;return`<pre class="previewText">${esc(d.summary||d.title)}</pre>`;}
function renderMeta(d){const extra=Object.entries(d.extra||{}).map(([k,v])=>`<div>${esc(k)}</div><div>${esc(v)}</div>`).join('');return`<div class="metaGrid">
  <div>CID</div><div class="cid">${esc(d.cid)}</div>
  <div>MIME</div><div>${esc(d.mime)}</div>
  <div>大小</div><div>${d.size} B</div>
  <div>应用</div><div>${esc(d.app_name||'-')}</div>
  <div>路径</div><div>${esc(d.file_path||'-')}</div>
  <div>URL</div><div>${d.url?`<a href="${esc(d.url)}" target="_blank">${esc(d.url)}</a>`:'-'}</div>
  <div>上一版本</div><div>${d.previous_version?`<button class="iconBtn" onclick="openEntry('${d.previous_version}')">打开上一版本</button>`:'-'}</div>
  ${extra}
</div>`;}
function closeDetail(){detailPane.classList.remove('open');streamPane.classList.remove('detailOpen');}
async function continueEntry(cid){const d=await fetch(`/api/entry/${cid}`).then(r=>r.json());if(d.kind==='Webpage'&&d.url){window.open(d.url,'_blank');return;}if(d.kind==='Image'){window.open(d.raw_url,'_blank');return;}openEntry(cid);}
function downloadEntry(cid){window.open(`/api/entry/${cid}/raw`,'_blank');}
function startEdit(){
  if(!activeDetail||activeDetail.text===null){showToast('这条数据不能直接编辑');return;}
  detail.querySelector('.actions').innerHTML=`<button class="iconBtn" onclick="openEntry('${activeDetail.cid}')">取消</button><button class="iconBtn primary" onclick="saveEdit()">保存为新版本</button>`;
  detail.querySelector('.detailBody').innerHTML=`<textarea class="editor" id="entryEditor">${esc(activeDetail.text)}</textarea>${renderMeta(activeDetail)}`;
  entryEditor.focus();
}
async function saveEdit(){
  if(!activeDetail)return;
  const text=entryEditor.value;
  const result=await fetch(`/api/entry/${activeDetail.cid}/edit`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,title:activeDetail.title})}).then(r=>r.json());
  if(result.unchanged){showToast('内容没有变化');return;}
  await refreshEntries();
  showToast('已保存为新版本');
  await openEntry(result.cid);
}

async function loadProcesses(){
  processList.innerHTML='<div class="empty" style="height:180px">正在读取进程</div>';
  try{
    allProcesses=await fetch('/api/processes').then(r=>r.json());
    renderProcesses(allProcesses);
  }catch(e){
    processList.innerHTML='<div class="empty" style="height:180px">无法获取进程列表</div>';
  }
}
function filterProcesses(){
  const q=procSearch.value.trim().toLowerCase();
  const filtered=allProcesses.filter(p=>!q||[p.name,p.exe,String(p.pid)].some(v=>(v||'').toLowerCase().includes(q)));
  renderProcesses(filtered);
}
function renderProcesses(procs){
  const aeonVMs=procs.filter(p=>p.kind&&p.kind.AeonVM);
  const knownApps=procs.filter(p=>p.kind&&p.kind.KnownApp);
  const others=procs.filter(p=>p.kind==='Unknown');
  let html='';
  if(aeonVMs.length)html+=aeonVMs.length>12
    ? renderCollapsedGroup(`⬡ AEON 进程 (${aeonVMs.length})`,aeonVMs,'var(--violet)')
    : renderGroup('⬡ AEON 进程',aeonVMs,'var(--violet)');
  if(knownApps.length)html+=renderGroup('已知应用',knownApps,'var(--green)');
  if(others.length)html+=`<details class="procGroup"><summary class="procGroupTitle" style="color:var(--muted)">其他进程 (${others.length}) 展开</summary>${others.slice(0,260).map(renderProcessItem).join('')}</details>`;
  processList.innerHTML=html||'<div class="empty" style="height:180px">没有找到进程</div>';
}
function renderGroup(title,procs,color){return`<div class="procGroup"><div class="procGroupTitle" style="color:${color}">${title}</div>${procs.map(renderProcessItem).join('')}</div>`;}
function renderCollapsedGroup(title,procs,color){return`<details class="procGroup"><summary class="procGroupTitle" style="color:${color}">${title} 展开</summary>${procs.map(renderProcessItem).join('')}</details>`;}
function renderProcessItem(p){
  const cpu=Math.min(Math.max(p.cpu_percent||0,0),100);
  return`<div class="procItem" id="proc-${p.pid}-${esc(getVmId(p)||'')}">
    <div class="procMain">
      <span class="procIcon">${getProcessIcon(p)}</span>
      <div class="procInfo">
        <div class="procName">${esc(p.name)}</div>
        <div class="procExe">${esc(p.exe||'')}</div>
        <div class="procStats">
          <span><span class="cpuTrack"><span class="cpuBar" style="width:${cpu}%"></span></span>CPU ${(p.cpu_percent||0).toFixed(1)}%</span>
          <span>内存 ${humanMem(p.memory_mb||0)}</span>
          <span>${p.pid?`PID ${p.pid}`:esc(getVmId(p)||'VM')}</span>
          <span>${esc(p.status)}</span>
        </div>
      </div>
    </div>
    <div class="procActions">${(p.capture_options||[]).map(opt=>`<button class="captureBtn ${captureClass(opt.kind)}" data-pid="${p.pid}" data-option="${esc(opt.id)}" data-label="${esc(opt.label)}" title="${esc(opt.description)}">${esc(opt.icon)} ${esc(opt.label)}</button>`).join('')}</div>
    <div class="procResult" id="result-${p.pid}-${esc(getVmId(p)||'proc')}" style="display:none"></div>
  </div>`;
}
function captureClass(kind){return{DeepCapture:'btnDeep',Screenshot:'btnScreenshot',Migrate:'btnMigrate',Pause:'btnPause',Snapshot:'btnSnapshot',Metadata:'btnMeta'}[kind]||'';}
function getVmId(p){return p.kind&&p.kind.AeonVM&&p.kind.AeonVM.vm_id;}
function getProcessIcon(p){
  if(p.kind&&p.kind.AeonVM)return'⬡';
  const appId=p.kind&&p.kind.KnownApp&&p.kind.KnownApp.app_id;
  return({ 'claude-desktop':'💬',vscode:'📝',chrome:'🌐',firefox:'🌐',obsidian:'🗒',office:'📄' }[appId])||'□';
}
processList.addEventListener('click',e=>{
  const btn=e.target.closest('.captureBtn');
  if(!btn)return;
  executeCaptureOption(Number(btn.dataset.pid),btn.dataset.option,btn.dataset.label,btn.closest('.procItem'));
});
async function executeCaptureOption(pid,optionId,label,item){
  const resultEl=item.querySelector('.procResult');
  resultEl.style.display='block';
  resultEl.innerHTML=`<span>正在${esc(label)}...</span>`;
  let target_device=null;
  if(optionId.startsWith('migrate_')){
    target_device=await selectTargetDevice();
    if(!target_device){resultEl.style.display='none';return;}
  }
  try{
    const data=await fetch('/api/capture-process',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pid,option_id:optionId,target_device})}).then(r=>r.json());
    showCaptureResult(resultEl,data,label);
  }catch(err){
    showCaptureResult(resultEl,{ok:false,error:'请求失败'},label);
  }
}
function showCaptureResult(el,data,label){
  if(data.ok){
    el.innerHTML=`<div class="captureSuccess">✓ ${esc(label)}完成 ${data.cid?`<span class="cid">CID ${esc(data.cid.slice(0,8))}…</span>`:''}<span>${esc(data.message||'')}</span></div>`;
    refreshEntries();
    if(data.cid)setTimeout(()=>openEntry(data.cid),600);
    setTimeout(()=>{el.style.display='none';},3600);
  }else{
    el.innerHTML=`<div class="captureError">✗ ${esc(data.error||'操作失败')}</div>`;
    setTimeout(()=>{el.style.display='none';},5200);
  }
}
async function selectTargetDevice(){
  await refreshStatus();
  const online=devices.filter(d=>d.online&&!d.is_local&&d.id!=='local');
  if(!online.length){alert('没有在线的其他设备。请在手机端打开 AEON Capture，并使用 AUTO FIND AEON 通过 AEON LAN Discovery 自动连接。');return null;}
  if(online.length===1)return online[0].id;
  const names=online.map((d,i)=>`${i+1}. ${d.name}`).join('\n');
  const idx=prompt(`选择目标设备：\n${names}\n\n输入序号:`);
  const i=Number.parseInt(idx,10)-1;
  return i>=0&&i<online.length?online[i].id:null;
}

function renderDevices(){
  if(!deviceList)return;
  renderConnectUrls();
  deviceList.innerHTML=(devices||[]).map(d=>`<div class="deviceRow"><div><strong>${esc(d.name)}</strong><div class="procExe">${esc(d.kind||'device')} · ${esc(d.id||'')}${d.last_seen_ms&&!d.is_local?` · ${Math.round(d.last_seen_ms/1000)}s ago`:''}</div></div><span class="badge">${d.online?'在线':'离线'}</span></div>`).join('')||'<div class="empty">没有设备</div>';
}
function renderConnectUrls(){
  if(!connectList)return;
  connectList.innerHTML=(connectUrls||[]).map(c=>`<div class="connectRow"><span class="badge">${esc(c.label)}${c.remote?' · Relay':''}</span><span class="connectUrl">${esc(c.url)}</span><button class="captureBtn btnMeta" data-copy-url="${esc(c.url)}">复制</button></div>`).join('')||'<div class="empty">没有连接地址</div>';
}
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-copy-url]');
  if(!btn)return;
  navigator.clipboard?.writeText(btn.dataset.copyUrl);
  showToast('连接地址已复制');
});
async function openVmPicker(){
  vmModal.classList.add('show');
  vmList.innerHTML='<div class="empty" style="height:160px">正在读取 AEON VM</div>';
  vms=await fetch('/api/vms').then(r=>r.json());
  renderVms();
  vmSearch.focus();
}
function closeVmPicker(){vmModal.classList.remove('show');}
function renderVms(){
  const q=vmSearch.value.trim().toLowerCase();
  const list=vms.filter(v=>!q||[v.id,v.status,v.program_path,v.program_id].some(x=>(x||'').toLowerCase().includes(q))).slice(0,240);
  vmList.innerHTML=list.map(v=>`
    <div class="procItem">
      <div class="procMain"><span class="procIcon">⬡</span><div class="procInfo"><div class="procName">${esc(v.id)} · ${esc(v.status)}</div><div class="procExe">${esc(v.program_path)}${v.error?' · '+esc(v.error):''}</div></div></div>
      <div class="procActions"><button class="captureBtn btnSnapshot" ${v.error?'disabled':''} onclick="captureVm('${esc(v.id)}')">💾 捕获快照</button></div>
    </div>`).join('')||'<div class="empty" style="height:160px">没有找到 AEON VM</div>';
}
async function captureVm(id){
  const result=await fetch(`/api/capture/vm/${encodeURIComponent(id)}`,{method:'POST'}).then(r=>r.ok?r.json():Promise.reject(r));
  closeVmPicker();
  await refreshEntries();
  setActiveKind('VmSnapshot');
  showToast(`已捕获 VM 快照 ${id}`);
  await openEntry(result.cid);
}
async function captureProcesses(){
  const result=await fetch('/api/capture/processes',{method:'POST'}).then(r=>r.json());
  await refreshEntries();
  if(result.ok&&result.cid){showToast(`已捕获 ${result.process_count||0} 个进程`);setActiveKind('ProcessState');await openEntry(result.cid);}
  else showToast(result.error||'进程清单捕获失败');
}
async function captureAll(){
  const result=await fetch('/api/capture/all',{method:'POST'}).then(r=>r.json());
  const captured=result.captured||[];
  await refreshEntries();
  if(captured.length){showToast(`已捕获全机状态：${result.process_count||0} 个进程，${Math.max(captured.length-1,0)} 个深度应用`);setActiveKind('all');await openEntry(captured[0]);}
  else showToast((result.errors&&result.errors[0])||'全机状态捕获失败');
}
async function captureApps(){
  const result=await fetch('/api/capture/apps',{method:'POST'}).then(r=>r.json());
  const captured=result.captured||[];
  await refreshEntries();
  if(captured.length){showToast(`已捕获 ${captured.length} 个应用`);await openEntry(captured[0]);}
  else showToast('没有检测到可捕获的应用状态');
}
async function captureDroppedFiles(files){const form=new FormData();for(const file of files)form.append('file',file,file.name);if(!files.length)return;await fetch('/api/capture/drop',{method:'POST',body:form});await refreshEntries();}
let dragDepth=0;
window.addEventListener('dragenter',e=>{e.preventDefault();dragDepth++;dropOverlay.classList.add('show');});
window.addEventListener('dragover',e=>{e.preventDefault();});
window.addEventListener('dragleave',e=>{dragDepth=Math.max(0,dragDepth-1);if(dragDepth===0)dropOverlay.classList.remove('show');});
window.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;dropOverlay.classList.remove('show');captureDroppedFiles([...e.dataTransfer.files]);});
pills.onclick=e=>{const b=e.target.closest('.pill');if(!b)return;setActiveKind(b.dataset.kind);};
search.oninput=renderStream;
procSearch.oninput=filterProcesses;
vmSearch.oninput=renderVms;
function setupWS(){const ws=new WebSocket(`ws://${location.host}/ws`);ws.onmessage=e=>{try{const msg=JSON.parse(e.data);if(msg.type==='capture'&&msg.entry){entries=[msg.entry,...entries.filter(x=>x.cid!==msg.entry.cid)];renderStream();return;}}catch{}refreshEntries();};ws.onclose=()=>setTimeout(setupWS,1500);}
refreshStatus();refreshEntries();setupWS();
setInterval(()=>refreshStatus().catch(()=>{}),10000);
</script>
