<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AEON</title></head>
<body style="font-family:sans-serif;background:#111;color:#eee;max-width:900px;margin:0 auto;padding:16px;">
<h2>⬡ AEON <small id="identity"></small></h2>
<input id="fileInput" type="file" multiple><button onclick="loadFiles()">刷新</button><hr>
<div id="list"></div>
<script>
async function loadStatus(){try{const r=await fetch('/api/status');const s=await r.json();document.getElementById('identity').textContent=s.identity_short||'';}catch{}}
async function loadFiles(){const r=await fetch('/api/files');const files=await r.json();document.getElementById('list').innerHTML=files.map(f=>`<div style='padding:8px;border-bottom:1px solid #333'>${f.name} (${f.size_human}) ${f.is_dir?'':'<a href="/api/download/'+encodeURIComponent(f.name)+'">下载</a> <button onclick="del(\''+f.name.replace(/'/g,"\\'")+"\')">删</button>'}</div>`).join('');}
async function del(name){await fetch('/api/files/'+encodeURIComponent(name),{method:'DELETE'});loadFiles();}
async function upload(files){const form=new FormData();for(const f of files)form.append('file',f);await fetch('/api/upload',{method:'POST',body:form});loadFiles();}
document.getElementById('fileInput').onchange=e=>upload(Array.from(e.target.files));
function connectWS(){const ws=new WebSocket(`ws://${location.host}/ws`);ws.onmessage=()=>loadFiles();ws.onclose=()=>setTimeout(connectWS,3000);}
loadStatus();loadFiles();connectWS();
</script></body></html>
