<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AEON Flow</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f0f1a;color:#e0e0ff;min-height:100vh}*{box-sizing:border-box;margin:0;padding:0}header{background:#1a1a2e;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2a2a4a;position:sticky;top:0;z-index:10}h1{font-size:18px;color:#7b7bff;letter-spacing:2px}.status{font-size:12px;color:#888}.status.online{color:#4cff91}.upload-zone{margin:16px;border:2px dashed #3a3a5a;border-radius:12px;padding:24px;text-align:center;cursor:pointer;transition:all .2s;background:#1a1a2e}.upload-zone:hover,.upload-zone.drag-over{border-color:#7b7bff;background:#1e1e38}.upload-zone input{display:none}.upload-icon{font-size:32px;margin-bottom:8px}.upload-text{color:#888;font-size:14px}.progress-bar{display:none;margin:0 16px 16px;background:#1a1a2e;border-radius:8px;overflow:hidden;height:6px}.progress-fill{height:100%;background:#7b7bff;transition:width .3s;width:0}.file-list{padding:0 16px 80px}.file-item{background:#1a1a2e;border-radius:10px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;border:1px solid #2a2a4a;transition:border-color .2s}.file-item:active{border-color:#7b7bff}.file-icon{font-size:28px;flex-shrink:0}.file-info{flex:1;min-width:0}.file-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-meta{font-size:12px;color:#666;margin-top:3px}.file-cid{font-size:10px;color:#444;font-family:monospace;margin-top:2px}.file-actions{display:flex;gap:8px;flex-shrink:0}.btn{padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:opacity .2s}.btn:active{opacity:.7}.btn-download{background:#2a4a7b;color:#7bb8ff}.btn-delete{background:#4a2a2a;color:#ff7b7b}.empty-state{text-align:center;padding:60px 20px;color:#555}.empty-icon{font-size:48px;margin-bottom:16px}.empty-text{font-size:16px}.refresh-btn{position:fixed;bottom:24px;right:20px;background:#7b7bff;color:white;border:none;border-radius:50%;width:52px;height:52px;font-size:22px;cursor:pointer;box-shadow:0 4px 20px rgba(123,123,255,.4)}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:10px 20px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1}</style>
</head>
<body>
<header><h1>⬡ AEON</h1><span class="status online" id="status">● 已连接</span></header>
<div class="upload-zone" id="uploadZone"><input type="file" id="fileInput" multiple><div class="upload-icon">📤</div><div class="upload-text">点击上传文件，或将文件拖到此处</div></div>
<div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
<div class="file-list" id="fileList"></div>
<button class="refresh-btn" onclick="loadFiles()" title="刷新">↻</button><div class="toast" id="toast"></div>
<script>
const ICONS={'image/':'🖼️','video/':'🎬','audio/':'🎵','text/':'📄','application/pdf':'📕','application/zip':'📦','application/x-zip':'📦','application/json':'📋','application/x-aeon':'⬡','inode/directory':'📁'};
function getIcon(mime){for(const [p,i]of Object.entries(ICONS)){if(mime.startsWith(p))return i}return'📄'}
function timeAgo(ms){const d=Date.now()-ms;if(d<6e4)return'刚刚';if(d<36e5)return Math.floor(d/6e4)+'分钟前';if(d<864e5)return Math.floor(d/36e5)+'小时前';return Math.floor(d/864e5)+'天前'}
function showToast(msg,duration=2e3){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),duration)}
async function loadFiles(){try{const res=await fetch('/api/files');const files=await res.json();const list=document.getElementById('fileList');if(files.length===0){list.innerHTML='<div class="empty-state"><div class="empty-icon">📂</div><div class="empty-text">还没有文件<br>上传一些吧</div></div>';return}list.innerHTML=files.map(f=>`<div class="file-item"><span class="file-icon">${getIcon(f.mime)}</span><div class="file-info"><div class="file-name">${f.name}</div><div class="file-meta">${f.size_human} · ${timeAgo(f.modified)}</div><div class="file-cid">CID: ${f.cid}…</div></div><div class="file-actions">${!f.is_dir?`<button class="btn btn-download" onclick="downloadFile('${f.name}')">下载</button>`:''}<button class="btn btn-delete" onclick="deleteFile('${f.name}')">删除</button></div></div>`).join('')}catch{document.getElementById('status').textContent='● 连接断开';document.getElementById('status').className='status'}}
function downloadFile(name){const a=document.createElement('a');a.href=`/api/download/${encodeURIComponent(name)}`;a.download=name;a.click();showToast('开始下载：'+name)}
async function deleteFile(name){if(!confirm(`删除 ${name}？`))return;await fetch(`/api/files/${encodeURIComponent(name)}`,{method:'DELETE'});showToast('已删除：'+name);loadFiles()}
async function uploadFiles(files){if(!files.length)return;const bar=document.getElementById('progressBar');const fill=document.getElementById('progressFill');bar.style.display='block';fill.style.width='10%';const form=new FormData();for(const f of files)form.append('file',f);try{fill.style.width='50%';const res=await fetch('/api/upload',{method:'POST',body:form});fill.style.width='100%';const data=await res.json();showToast(`上传成功：${data.uploaded?.length||0} 个文件`);loadFiles()}catch{showToast('上传失败')}finally{setTimeout(()=>{bar.style.display='none';fill.style.width='0%'},800)}}
document.getElementById('uploadZone').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=e=>uploadFiles(Array.from(e.target.files));
const zone=document.getElementById('uploadZone');zone.ondragover=e=>{e.preventDefault();zone.classList.add('drag-over')};zone.ondragleave=()=>zone.classList.remove('drag-over');zone.ondrop=e=>{e.preventDefault();zone.classList.remove('drag-over');uploadFiles(Array.from(e.dataTransfer.files))};
loadFiles();setInterval(loadFiles,3e4);
</script>
</body>
</html>
