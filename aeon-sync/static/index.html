<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEON Capture</title>
<style>
:root{
  color-scheme:dark;
  --bg:#04070a;
  --panel-bg:#090f13;
  --border:#182e38;
  --border-active:#00ff88;
  --text:#b2eed6;
  --muted:#488277;
  --green:#00ff88;
  --cyan:#00e5ff;
  --yellow:#ffe600;
  --orange:#ff9100;
  --magenta:#ff007f;
  --purple:#b82eff;
  --red:#ff3355;
  --blue:#00aaff;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'JetBrains Mono', 'Fira Code', 'Courier New', Courier, monospace;
  font-style:italic;
  font-size:13px;
  line-height:1.4;
  overflow:hidden;
}
button,input,textarea{font:inherit}
button{cursor:pointer}

/* Non-italic components */
.procIcon, .badge, .cpuTrack, .emoji {
  font-style: normal;
}

/* Scrollbars */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: var(--bg);
}
::-webkit-scrollbar-thumb {
  background: var(--border);
}
::-webkit-scrollbar-thumb:hover {
  background: var(--muted);
}

/* Tmux Header */
.top{
  height: 32px;
  background: var(--panel-bg);
  border-bottom: none;
  display: flex;
  align-items: center;
  padding: 0;
  font-family: inherit;
  font-size: 12px;
  overflow: hidden;
}
.brand{
  background: var(--green);
  color: #000000;
  padding: 0 16px;
  height: 100%;
  display: flex;
  align-items: center;
  font-weight: 800;
  letter-spacing: 0.5px;
  font-style: normal;
}
.tabs{
  display: flex;
  align-items: center;
  gap: 0;
  height: 100%;
}
.tab{
  height: 100%;
  border: none;
  background: transparent;
  color: var(--muted);
  padding: 0 16px;
  cursor: pointer;
  font-weight: 700;
  text-transform: uppercase;
  border-radius: 0;
  display: inline-flex;
  align-items: center;
  transition: all 0.1s ease;
  border-bottom: 2px solid transparent;
}
.tab.active{
  color: var(--blue);
  font-weight: 800;
  border-bottom: 2px solid var(--blue);
}
.tab:hover:not(.active){
  color: var(--text);
}
.identity{
  margin-left: auto;
  padding: 0 16px;
  color: var(--yellow);
  font-weight: 700;
  display: flex;
  align-items: center;
  height: 100%;
}
.clock{
  color: var(--cyan);
  padding: 0 16px;
  font-weight: 700;
  height: 100%;
  display: flex;
  align-items: center;
  background: transparent;
}

/* Tab content layouts */
.tabContent{
  display:none;
  height:calc(100vh - 32px);
  min-height:0;
}
.tabContent.active{
  display:block;
}

/* Shell stream layout */
.shell{
  display:grid;
  grid-template-columns:minmax(320px,440px) 1fr;
  height:100%;
  min-height:0;
  padding: 8px;
  gap: 8px;
  background: var(--bg);
}
.streamPane{
  border: none;
  background:var(--panel-bg);
  min-width:0;
  display:flex;
  flex-direction:column;
}
.detailPane{
  border: none;
  background:var(--panel-bg);
  min-width:0;
  display:flex;
  flex-direction:column;
}

/* Pane Header */
.pane-header {
  height: 32px;
  background: transparent;
  color: var(--cyan);
  font-weight: 800;
  font-size: 11px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px 0 12px;
  letter-spacing: 1px;
}
.pane-header::before {
  content: '■ ';
  color: var(--green);
  margin-right: 4px;
}
.pane-subtitle {
  color: var(--muted);
  font-size: 10px;
  font-weight: 400;
}

/* Filters */
.filter{
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:transparent;
}
.search{
  width:100%;
  height:36px;
  border: none;
  border-bottom: 1px solid var(--border);
  background: transparent;
  color:var(--text);
  padding:0 4px;
  border-radius:0;
}
.search:focus{
  outline:none;
  border-bottom-color:var(--green);
}

.pills{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:2px;
}
.pill{
  border: none;
  background:transparent;
  color:var(--muted);
  border-radius:0;
  padding:4px 8px;
  font-size:11px;
  cursor:pointer;
  text-transform:uppercase;
  font-weight:700;
  transition:all 0.1s ease;
  white-space:nowrap;
  border-bottom: 2px solid transparent;
}
.pill:hover:not(.active){
  color:var(--text);
}
.pill.active{
  color:var(--green);
  border-bottom: 2px solid var(--green);
}

/* Stream list */
.stream{
  overflow-y:auto;
  flex:1;
  background:transparent;
  padding: 4px 8px;
}
.entry{
  display:grid;
  grid-template-columns:80px 1fr;
  gap:12px;
  padding:12px;
  border: none;
  border-radius: 4px;
  background: rgba(24, 46, 56, 0.05);
  margin-bottom: 6px;
  cursor:pointer;
  transition:all 0.1s ease;
}
.entry:nth-child(even) {
  background: rgba(24, 46, 56, 0.1);
}
.entry:hover{
  background: rgba(24, 46, 56, 0.15);
}
.entry.active{
  background: rgba(24, 46, 56, 0.22);
}
.time{
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
  background: transparent;
  padding: 2px 4px;
  text-align:left;
  align-self:start;
}
.entryBody{
  min-width:0;
}
.entryTitle{
  font-weight:700;
  font-size:13px;
  color:var(--text);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.summary{
  color:var(--muted);
  font-size:12px;
  margin-top:6px;
  line-height:1.4;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.source{
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:8px;
  color:var(--muted);
  font-size:11px;
}
.badge{
  font-size:10px;
  font-weight:800;
  padding:2px 6px;
  border:1px solid currentColor;
  border-radius:0;
  background:rgba(0, 0, 0, 0.4);
  text-transform:uppercase;
  display:inline-flex;
  align-items:center;
}

/* Detail pane content */
.detailHead{
  padding:16px;
  border-bottom: 1px solid rgba(24, 46, 56, 0.2);
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:transparent;
  gap:16px;
}
.detailTitle{
  font-size:16px;
  font-weight:800;
  color:var(--yellow);
  word-break:break-all;
}
.detailMeta{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}
.actions{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}
.detailBody{
  padding:16px;
  overflow-y:auto;
  flex:1;
  display:flex;
  flex-direction:column;
  background:transparent;
}
.empty{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  text-align:center;
  padding:20px;
}

/* Custom buttons */
.iconBtn, .captureBtn{
  font-family:inherit;
  font-weight:700;
  font-size:11px;
  text-transform:uppercase;
  border: none;
  border-bottom: 2px solid var(--border);
  background: rgba(24, 46, 56, 0.2);
  color:var(--text);
  padding:6px 12px;
  border-radius:0;
  transition:all 0.15s ease;
  cursor:pointer;
  outline:none;
}
.iconBtn:hover:not(:disabled), .captureBtn:hover:not(:disabled){
  background:var(--green);
  color:#000000;
  border-bottom-color:var(--green);
}
.iconBtn.primary{
  background: rgba(0, 255, 136, 0.12);
  color: var(--green);
  border-bottom-color:var(--green);
}
.iconBtn.primary:hover:not(:disabled){
  background:var(--green);
  color:#000000;
  border-bottom-color:var(--green);
}
.iconBtn:disabled, .captureBtn:disabled{
  opacity:0.3;
  cursor:not-allowed;
  border-bottom-color: var(--border) !important;
  background: transparent !important;
  color: var(--muted) !important;
}

/* Previews */
.previewText{
  margin:0;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  background: rgba(9, 15, 19, 0.6);
  border: none;
  border-left:3px solid var(--green);
  border-radius:0;
  padding:14px;
  line-height:1.5;
  font-family:inherit;
  font-size:13px;
  color:var(--text);
}
.previewImage{
  max-width:100%;
  height:auto;
  border: none;
  border-radius:0;
  background:#090a0d;
  display:block;
  margin:0 auto 16px;
}

/* Meta grids */
.metaGrid{
  display:grid;
  grid-template-columns:150px 1fr;
  border: none;
  background: transparent;
  margin-top: 16px;
  font-size: 12px;
  gap: 6px 12px;
}
.metaGrid > div {
  padding: 4px 0;
  border-bottom: none;
  border-right: none;
}
.metaGrid > div:nth-child(2n) {
  border-right: none;
  font-family: inherit;
  word-break: break-all;
  color: var(--text);
}
.metaGrid div:nth-child(odd) {
  color: var(--muted);
  font-weight: 700;
  text-transform: uppercase;
}
.cid{
  color:var(--green);
  font-weight:700;
}

.editor{
  width:100%;
  min-height:360px;
  resize:vertical;
  border: none;
  border-bottom: 2px solid var(--border);
  background: rgba(9, 15, 19, 0.6);
  color:var(--text);
  padding:14px;
  font-family:inherit;
  line-height:1.5;
  outline:none;
}
.editor:focus{
  border-bottom-color:var(--green);
}

/* Process Page */
.processPage{
  height:100%;
  display:flex;
  flex-direction:column;
  padding:8px;
  background:var(--bg);
}
.processContainer{
  flex: 1;
  border: none;
  background: var(--panel-bg);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.processToolbar{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  padding:10px 12px;
  border-bottom: 1px solid rgba(24, 46, 56, 0.4);
  background: transparent;
  align-items:center;
}
.processToolbar .search{
  flex:1;
  min-width:200px;
}
.processList{
  overflow-y:auto;
  flex:1;
  background:transparent;
  padding: 4px 8px;
}

/* Collapsible Process Groups (Details) */
.procGroup{
  border-bottom: none;
  margin-bottom: 8px;
}
.procGroupTitle{
  padding:10px 14px;
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  background: rgba(24, 46, 56, 0.15);
  color:var(--muted);
  cursor:pointer;
  display:flex;
  align-items:center;
  user-select:none;
  border-radius: 4px;
}
.procGroup summary {
  list-style:none;
  outline:none;
}
.procGroup summary::-webkit-details-marker {
  display:none;
}
.procGroup summary::before {
  content: '▶ ';
  display: inline-block;
  margin-right: 8px;
  transition: transform 0.15s ease;
  color: var(--muted);
  font-style: normal;
}
.procGroup[open] summary::before {
  content: '▼ ';
}

/* Process list items */
.procItem{
  padding:12px 14px;
  border: none;
  border-radius: 4px;
  background: rgba(24, 46, 56, 0.05);
  margin-bottom: 6px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.procItem:nth-child(even) {
  background: rgba(24, 46, 56, 0.1);
}
.procItem:hover{
  background: rgba(24, 46, 56, 0.15);
}
.procMain{
  display:flex;
  align-items:center;
  gap:12px;
}
.procIcon{
  font-size:16px;
  width:24px;
  text-align:center;
  color:var(--blue);
}
.procInfo{
  flex:1;
  min-width:0;
  display:grid;
  grid-template-columns:220px 1fr;
  gap:12px;
  align-items:center;
}
.procName{
  font-weight:700;
  color:var(--text);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.procExe{
  font-size:11px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.procStats{
  grid-column: 1 / -1;
  display:flex;
  gap:16px;
  align-items:center;
  font-size:11px;
  color:var(--text);
  margin-top:4px;
  flex-wrap:wrap;
}

/* Retro repeating gradient CPU meter */
.cpuTrack{
  width:80px;
  height:8px;
  background: rgba(24, 46, 56, 0.2);
  border: none;
  display:inline-flex;
  margin-right:8px;
  overflow:hidden;
  position:relative;
  vertical-align:middle;
}
.cpuBar{
  height:100%;
  width:0%;
  transition:width 0.2s ease;
}
.cpuBar.low {
  background: repeating-linear-gradient(90deg, var(--green), var(--green) 3px, transparent 3px, transparent 5px);
}
.cpuBar.medium {
  background: repeating-linear-gradient(90deg, var(--orange), var(--orange) 3px, transparent 3px, transparent 5px);
}
.cpuBar.high {
  background: repeating-linear-gradient(90deg, var(--red), var(--red) 3px, transparent 3px, transparent 5px);
}

.procActions{
  display:flex;
  gap:8px;
  margin-left:36px;
  flex-wrap:wrap;
}

/* Colorful action button borders */
.btnDeep{border-bottom:2px solid var(--blue); color:var(--blue); background:transparent;}
.btnDeep:hover:not(:disabled){background:var(--blue); color:#000000;}

.btnScreenshot{border-bottom:2px solid var(--green); color:var(--green); background:transparent;}
.btnScreenshot:hover:not(:disabled){background:var(--green); color:#000000;}

.btnMigrate{border-bottom:2px solid var(--purple); color:var(--purple); background:transparent;}
.btnMigrate:hover:not(:disabled){background:var(--purple); color:#000000;}

.btnPause{border-bottom:2px solid var(--orange); color:var(--orange); background:transparent;}
.btnPause:hover:not(:disabled){background:var(--orange); color:#000000;}

.btnSnapshot{border-bottom:2px solid var(--cyan); color:var(--cyan); background:transparent;}
.btnSnapshot:hover:not(:disabled){background:var(--cyan); color:#000000;}

.btnMeta{border-bottom:2px solid var(--muted); color:var(--text); background:transparent;}
.btnMeta:hover:not(:disabled){background:var(--text); color:#000000;}

.procResult{
  margin-left:36px;
  font-size:12px;
  color:var(--yellow);
}
.captureSuccess{
  display:flex;
  gap:8px;
  align-items:center;
  color:var(--green);
  font-weight:700;
}
.captureError{
  color:var(--red);
  font-weight:700;
}

/* Devices Page Layout */
.devicesPage{
  padding:8px;
  height:100%;
  display:flex;
  flex-direction:column;
  gap:8px;
  background:var(--bg);
}
.devicePanel {
  border: none;
  background: var(--panel-bg);
  display: flex;
  flex-direction: column;
}
.connectHint{
  color:var(--text);
  font-size:12px;
  padding:10px 14px;
  border-left:4px solid var(--blue);
  background:var(--panel-bg);
  margin-bottom:4px;
}
.connectBlock-new{
  background: transparent;
  padding: 4px 8px;
}
.connectRow{
  display:grid;
  grid-template-columns:180px minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
  padding:12px 14px;
  border: none;
  border-radius: 4px;
  background: rgba(24, 46, 56, 0.05);
  margin-bottom: 6px;
}
.connectRow:nth-child(even) {
  background: rgba(24, 46, 56, 0.1);
}
.connectUrl{
  font-family:inherit;
  color:var(--green);
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.deviceRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border: none;
  border-radius: 4px;
  background: rgba(24, 46, 56, 0.05);
  margin-bottom: 6px;
  padding:12px 14px;
  gap:14px;
}
.deviceRow:nth-child(even) {
  background: rgba(24, 46, 56, 0.1);
}

/* Toast */
.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:99;
  max-width:min(420px,calc(100vw - 36px));
  padding:12px 16px;
  border-bottom: 3px solid var(--yellow);
  background: var(--panel-bg);
  color:var(--text);
  box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
  font-weight:700;
  display:none;
}
.toast.show{
  display:block;
}

/* Drag overlay */
.dropOverlay{
  position:fixed;
  inset:0;
  background:rgba(4, 7, 10, 0.95);
  display:none;
  place-items:center;
  z-index:100;
  border:3px dashed var(--green);
  color:var(--green);
  font-size:24px;
  font-weight:800;
}
.dropOverlay.show{
  display:grid;
}

/* Modal Popup */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(2px);
  z-index:10;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal.show{
  display:flex;
}
.modalPanel{
  width:min(720px,100%);
  max-height:min(680px,calc(100vh - 40px));
  background:var(--panel-bg);
  border: 1px solid var(--border);
  box-shadow: 0 10px 40px rgba(0,0,0,0.7);
  display:flex;
  flex-direction:column;
  border-radius:0;
}
.modalHead{
  background:var(--blue);
  color:#000000;
  font-weight:800;
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:12px;
}
.modalTitle{
  font-weight:850;
  text-transform:uppercase;
}
.modalHead .search{
  background: rgba(0, 0, 0, 0.25);
  color:#000000;
  border: none;
  border-bottom: 1px solid rgba(0, 0, 0, 0.4);
  height:28px;
  padding:0 8px;
  font-size:12px;
}
.modalHead .search:focus{
  border-bottom-color:#000000;
}
.modalHead .iconBtn{
  height:28px;
  padding:0 10px;
  background:#000000;
  color:var(--blue);
  border-color:transparent;
  border-bottom: 2px solid var(--blue);
}
.modalHead .iconBtn:hover{
  background:#ffffff;
  color:#000000;
  border-bottom-color:#ffffff;
}

/* Responsiveness overrides */
@media (max-width:820px){
  .top{
    height:auto;
    flex-wrap:wrap;
  }
  .brand{
    height:32px;
    width:100%;
    justify-content:center;
  }
  .tabs{
    width:100%;
    height:32px;
  }
  .tab{
    flex:1;
    justify-content:center;
  }
  .identity{
    display:none;
  }
  .clock{
    display:none;
  }
  .processToolbar{
    flex-direction:column;
    align-items:stretch;
  }
  .processToolbar .search{
    width:100%;
  }
  .shell{
    grid-template-columns:1fr;
  }
  .detailPane{
    display:none;
  }
  .detailPane.open{
    display:flex;
    position:fixed;
    inset:64px 0 0;
    z-index:2;
  }
  .streamPane.detailOpen{
    display:none;
  }
  .detailHead{
    flex-direction:column;
    align-items:stretch;
  }
  .procActions,.procResult{
    margin-left:0;
  }
  .metaGrid{
    grid-template-columns:1fr;
  }
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400;1,500;1,700;1,800&display=swap" rel="stylesheet">
</head>
<body>
<div class="top">
  <div class="brand">⬡ AEON-FLOW</div>
  <nav class="tabs">
    <button class="tab active" data-tab="stream">0:捕获流*</button>
    <button class="tab" data-tab="processes">1:进程面板</button>
    <button class="tab" data-tab="devices">2:设备</button>
  </nav>
  <div class="identity" id="identity"></div>
  <div class="clock" id="topClock"></div>
</div>

<section class="tabContent active" id="tab-stream">
  <main class="shell">
    <section class="streamPane" id="streamPane">
      <div class="pane-header">
        <span>CAPTURE STREAM</span>
        <span class="pane-subtitle" id="streamCount">TOTAL: 0</span>
      </div>
      <div class="filter">
        <input class="search" id="search" placeholder="搜索捕获内容...">
        <div class="pills" id="pills">
          <button class="pill active" data-kind="all">全部</button>
          <button class="pill" data-kind="Conversation">对话</button>
          <button class="pill" data-kind="Code">代码</button>
          <button class="pill" data-kind="Image">图片</button>
          <button class="pill" data-kind="ProcessState">进程</button>
          <button class="pill" data-kind="VmSnapshot">VM 快照</button>
          <button class="pill" data-kind="Clipboard">剪贴板</button>
        </div>
      </div>
      <div class="stream" id="stream"></div>
    </section>
    <section class="detailPane" id="detailPane">
      <div class="pane-header">
        <span>CAPTURE DETAILS</span>
        <span class="pane-subtitle" id="detailStatus">INACTIVE</span>
      </div>
      <div class="empty" id="empty">
        <div style="font-size: 14px; font-weight: 800; margin-bottom: 8px; color: var(--muted);">NO ENTRY SELECTED</div>
        <div style="font-size: 11px; color: var(--muted);">SELECT A CAPTURE FROM THE LEFT STREAM PANE</div>
      </div>
      <div id="detail" style="display:none;height:100%;min-height:0;flex-direction:column"></div>
    </section>
  </main>
</section>

<section class="tabContent" id="tab-processes">
  <div class="processPage">
    <div class="processContainer">
      <div class="pane-header">
        <span>PROCESS MONITOR</span>
        <span class="pane-subtitle" id="procCount">COUNT: 0</span>
      </div>
      <div class="processToolbar">
        <input class="search" id="procSearch" placeholder="搜索进程、PID、路径...">
        <button class="iconBtn secondaryRefresh" onclick="loadProcesses()">刷新</button>
        <button class="iconBtn" onclick="captureProcesses()">捕获进程清单</button>
        <button class="iconBtn primary" onclick="captureAll()">捕获全机状态</button>
      </div>
      <div class="processList" id="processList"></div>
    </div>
  </div>
</section>

<section class="tabContent" id="tab-devices">
  <div class="devicesPage">
    <div class="connectHint">
      Android 端会通过 <span style="color: var(--green); font-weight: 700;">AEON LAN Discovery</span> 自动找到桌面；跨网络时使用自研 <span style="color: var(--cyan); font-weight: 700;">AEON Relay</span>。
    </div>
    <div class="devicePanel">
      <div class="pane-header">
        <span>AEON RELAY / CONNECTION URLS</span>
        <span class="pane-subtitle">CONFIGURED</span>
      </div>
      <div class="connectBlock-new">
        <div id="connectList"></div>
      </div>
    </div>
    <div class="devicePanel" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
      <div class="pane-header">
        <span>DETECTED DEVICES</span>
        <span class="pane-subtitle" id="deviceCount">ONLINE: 0</span>
      </div>
      <div id="deviceList" class="processList" style="flex: 1; overflow: auto;"></div>
    </div>
  </div>
</section>

<div class="dropOverlay" id="dropOverlay">松开以捕获</div>
<div class="toast" id="toast"></div>
<div class="modal" id="vmModal" onclick="if(event.target===vmModal)closeVmPicker()">
  <div class="modalPanel">
    <div class="modalHead">
      <div class="modalTitle">捕获 AEON VM</div>
      <input class="search" id="vmSearch" placeholder="搜索 VM、状态或程序">
      <button class="iconBtn" onclick="closeVmPicker()">关闭</button>
    </div>
    <div class="processList" id="vmList"></div>
  </div>
</div>
<script>
let entries=[],activeKind='all',currentCid=null,activeDetail=null,allProcesses=[],vms=[],devices=[],connectUrls=[];
let toastTimer=null;
const esc=s=>(s===null||s===undefined?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtTime=ms=>{const d=Date.now()-ms;if(d<60000)return'刚刚';if(d<3600000)return`${Math.floor(d/60000)}m前`;if(d<86400000)return`${Math.floor(d/3600000)}h前`;return new Date(ms).toLocaleString();};
const compact=s=>s&&s.length>140?s.slice(0,140)+'...':s||'';
const humanMem=mb=>mb>=1024?(mb/1024).toFixed(1)+' GB':mb+' MB';

// Deterministic HSL color generator for consistent signature colors based on semantic names
const getColor = (str, s=80, l=65) => {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = str.charCodeAt(i) + ((hash << 5) - hash);
  }
  const h = Math.abs(hash) % 360;
  return `hsl(${h}, ${s}%, ${l}%)`;
};

function updateClock(){
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const topClock = document.getElementById('topClock');
  if (topClock) {
    topClock.textContent = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }
}

async function refreshStatus(){
  const s=await fetch('/api/status').then(r=>r.json());
  devices=s.devices||[];
  connectUrls=s.connect_urls||[];
  identity.textContent=s.identity_short?`ID ${s.identity_short}`:'';
  renderDevices();
}
async function refreshEntries(){entries=await fetch('/api/entries').then(r=>r.json());renderStream();}
function showToast(message){clearTimeout(toastTimer);toast.textContent=message;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),3800);}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>{
    const isActive = t.dataset.tab === name;
    t.classList.toggle('active', isActive);
    let txt = t.textContent.replace('*', '');
    if (isActive) txt += '*';
    t.textContent = txt;
  });
  document.querySelectorAll('.tabContent').forEach(c=>c.classList.toggle('active',c.id===`tab-${name}`));
  if(name==='processes')loadProcesses();
  if(name==='devices')refreshStatus();
}
document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>switchTab(tab.dataset.tab));

function setActiveKind(kind){activeKind=kind;document.querySelectorAll('.pill').forEach(x=>x.classList.toggle('active',x.dataset.kind===kind));renderStream();}
function filteredEntries(){const q=search.value.trim().toLowerCase();return entries.filter(e=>(activeKind==='all'||e.kind===activeKind)&&(!q||[e.title,e.summary,e.source_label,e.cid,...Object.values(e.extra||{})].some(v=>(v||'').toLowerCase().includes(q))));}

function renderStream(){
  const list=filteredEntries();
  const streamCount = document.getElementById('streamCount');
  if(streamCount) streamCount.textContent = `TOTAL: ${list.length}`;
  stream.innerHTML=list.map(e=>{
    const badgeColor = getColor(e.kind, 90, 70);
    const sourceColor = getColor(e.source_label, 75, 65);
    return `
    <div class="entry ${currentCid===e.cid?'active':''}" onclick="openEntry('${e.cid}')">
      <div class="time">${fmtTime(e.captured_at)}</div>
      <div class="entryBody">
        <div class="entryTitle">${esc(e.title)}</div>
        <div class="summary">${esc(compact(e.summary))}</div>
        <div class="source">
          <span class="badge" style="color: ${badgeColor}; border-color: ${badgeColor};">${esc(e.kind_label)}</span>
          <span style="color: ${sourceColor}">${esc(e.source_label)}</span>
        </div>
      </div>
    </div>`;
  }).join('')||'<div class="empty" style="height:180px">暂无捕获</div>';
}

async function openEntry(cid){
  currentCid=cid;
  renderStream();
  const d=await fetch(`/api/entry/${cid}`).then(r=>r.json());
  activeDetail=d;
  empty.style.display='none';
  detail.style.display='flex';
  detailPane.classList.add('open');
  streamPane.classList.add('detailOpen');
  const detailStatus = document.getElementById('detailStatus');
  if(detailStatus) detailStatus.textContent = `ACTIVE: ${cid.slice(0,8)}`;
  const canContinue=['Conversation','Code','Text','Clipboard','Webpage'].includes(d.kind);
  const canEdit=d.editable&&d.text!==null;
  detail.innerHTML=`
    <div class="detailHead">
      <div>
        <div class="detailTitle">${esc(d.title)}</div>
        <div class="detailMeta" style="margin-top: 6px; display: flex; align-items: center; gap: 8px;">
          <span class="badge" style="color: ${getColor(d.kind, 90, 70)}; border-color: ${getColor(d.kind, 90, 70)};">${esc(d.kind_label)}</span>
          <span style="color: var(--muted)">·</span>
          <span style="color: ${getColor(d.source_label, 75, 65)}">${esc(d.source_label)}</span>
          <span style="color: var(--muted)">·</span>
          <span>${fmtTime(d.captured_at)}</span>
        </div>
      </div>
      <div class="actions">
        <button class="iconBtn" onclick="closeDetail()">返回</button>
        <button class="iconBtn primary" ${canContinue?'':'disabled'} onclick="continueEntry('${d.cid}')">继续</button>
        <button class="iconBtn" ${canEdit?'':'disabled'} onclick="startEdit()">编辑</button>
        <button class="iconBtn" onclick="downloadEntry('${d.cid}')">打开原始内容</button>
      </div>
    </div>
    <div class="detailBody">${renderPreview(d)}${renderMeta(d)}</div>`;
}

function renderPreview(d){if(d.kind==='Image')return`<img class="previewImage" src="${d.raw_url}" alt="">`;if(d.kind==='VmSnapshot')return`<pre class="previewText">${esc(d.summary||d.title)}

${esc(Object.entries(d.extra||{}).map(([k,v])=>`${k}: ${v}`).join('\n'))}</pre>`;if(d.text)return`<pre class="previewText">${esc(d.text)}</pre>`;return`<pre class="previewText">${esc(d.summary||d.title)}</pre>`;}
function renderMeta(d){const extra=Object.entries(d.extra||{}).map(([k,v])=>`<div>${esc(k)}</div><div>${esc(v)}</div>`).join('');return`<div class="metaGrid">
  <div>CID</div><div class="cid">${esc(d.cid)}</div>
  <div>MIME</div><div>${esc(d.mime)}</div>
  <div>大小</div><div>${d.size} B</div>
  <div>应用</div><div>${esc(d.app_name||'-')}</div>
  <div>路径</div><div>${esc(d.file_path||'-')}</div>
  <div>URL</div><div>${d.url?`<a href="${esc(d.url)}" target="_blank" style="color: var(--cyan); text-decoration: none;">${esc(d.url)}</a>`:'-'}</div>
  <div>上一版本</div><div>${d.previous_version?`<button class="iconBtn" onclick="openEntry('${d.previous_version}')" style="padding: 3px 8px; font-size: 11px;">打开上一版本</button>`:'-'}</div>
  ${extra}
</div>`;}

function closeDetail(){
  detailPane.classList.remove('open');
  streamPane.classList.remove('detailOpen');
  const detailStatus = document.getElementById('detailStatus');
  if(detailStatus) detailStatus.textContent = `INACTIVE`;
}

async function continueEntry(cid){const d=await fetch(`/api/entry/${cid}`).then(r=>r.json());if(d.kind==='Webpage'&&d.url){window.open(d.url,'_blank');return;}if(d.kind==='Image'){window.open(d.raw_url,'_blank');return;}openEntry(cid);}
function downloadEntry(cid){window.open(`/api/entry/${cid}/raw`,'_blank');}
function startEdit(){
  if(!activeDetail||activeDetail.text===null){showToast('这条数据不能直接编辑');return;}
  detail.querySelector('.actions').innerHTML=`<button class="iconBtn" onclick="openEntry('${activeDetail.cid}')">取消</button><button class="iconBtn primary" onclick="saveEdit()">保存为新版本</button>`;
  detail.querySelector('.detailBody').innerHTML=`<textarea class="editor" id="entryEditor">${esc(activeDetail.text)}</textarea>${renderMeta(activeDetail)}`;
  entryEditor.focus();
}
async function saveEdit(){
  if(!activeDetail)return;
  const text=entryEditor.value;
  const result=await fetch(`/api/entry/${activeDetail.cid}/edit`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,title:activeDetail.title})}).then(r=>r.json());
  if(result.unchanged){showToast('内容没有变化');return;}
  await refreshEntries();
  showToast('已保存为新版本');
  await openEntry(result.cid);
}

async function loadProcesses(){
  processList.innerHTML='<div class="empty" style="height:180px"><div style="font-size: 14px; font-weight: 800; color: var(--muted); margin-bottom: 8px;">READING PROCESSES...</div><div style="font-size: 11px; color: var(--muted);">WAIT A MOMENT</div></div>';
  try{
    allProcesses=await fetch('/api/processes').then(r=>r.json());
    renderProcesses(allProcesses);
  }catch(e){
    processList.innerHTML='<div class="empty" style="height:180px">无法获取进程列表</div>';
  }
}
function filterProcesses(){
  const q=procSearch.value.trim().toLowerCase();
  const filtered=allProcesses.filter(p=>!q||[p.name,p.exe,String(p.pid)].some(v=>(v||'').toLowerCase().includes(q)));
  renderProcesses(filtered);
}
function renderProcesses(procs){
  const aeonVMs=procs.filter(p=>p.kind&&p.kind.AeonVM);
  const knownApps=procs.filter(p=>p.kind&&p.kind.KnownApp);
  const others=procs.filter(p=>p.kind==='Unknown');
  const procCount = document.getElementById('procCount');
  if(procCount) procCount.textContent = `COUNT: ${procs.length}`;
  let html='';
  if(aeonVMs.length)html+=aeonVMs.length>12
    ? renderCollapsedGroup(`⬡ AEON 进程 (${aeonVMs.length})`,aeonVMs,'var(--purple)')
    : renderGroup('⬡ AEON 进程',aeonVMs,'var(--purple)');
  if(knownApps.length)html+=renderGroup('已知应用',knownApps,'var(--cyan)');
  if(others.length)html+=`<details class="procGroup"><summary class="procGroupTitle" style="color:var(--muted)">其他进程 (${others.length})</summary>${others.slice(0,260).map(renderProcessItem).join('')}</details>`;
  processList.innerHTML=html||'<div class="empty" style="height:180px">没有找到进程</div>';
}
function renderGroup(title,procs,color){return`<div class="procGroup"><div class="procGroupTitle" style="color:${color}">${title}</div>${procs.map(renderProcessItem).join('')}</div>`;}
function renderCollapsedGroup(title,procs,color){return`<details class="procGroup"><summary class="procGroupTitle" style="color:${color}">${title}</summary>${procs.map(renderProcessItem).join('')}</details>`;}

function renderProcessItem(p){
  const cpu=Math.min(Math.max(p.cpu_percent||0,0),100);
  const cpuClass = cpu > 70 ? 'high' : (cpu > 30 ? 'medium' : 'low');
  const nameColor = getColor(p.name, 90, 75);
  const exeColor = getColor(p.exe || 'unknown', 70, 55);
  const iconColor = getColor(p.name, 90, 65);
  return`<div class="procItem" id="proc-${p.pid}-${esc(getVmId(p)||'')}">
    <div class="procMain">
      <span class="procIcon" style="color: ${iconColor}">${getProcessIcon(p)}</span>
      <div class="procInfo">
        <div class="procName" style="color: ${nameColor}">${esc(p.name)}</div>
        <div class="procExe" style="color: ${exeColor}">${esc(p.exe||'')}</div>
        <div class="procStats">
          <span><span class="cpuTrack"><span class="cpuBar ${cpuClass}" style="width:${cpu}%"></span></span>CPU <span style="color: ${cpu > 70 ? 'var(--red)' : (cpu > 30 ? 'var(--orange)' : 'var(--green)')}; font-weight:700;">${(p.cpu_percent||0).toFixed(1)}%</span></span>
          <span>内存 <span style="color: var(--green); font-weight:700;">${humanMem(p.memory_mb||0)}</span></span>
          <span>PID <span style="color: var(--yellow); font-weight:700;">${p.pid?p.pid:esc(getVmId(p)||'VM')}</span></span>
          <span>状态 <span style="color: var(--blue); font-weight:700;">${esc(p.status)}</span></span>
        </div>
      </div>
    </div>
    <div class="procActions">${(p.capture_options||[]).map(opt=>`<button class="captureBtn ${captureClass(opt.kind)}" data-pid="${p.pid}" data-option="${esc(opt.id)}" data-label="${esc(opt.label)}" title="${esc(opt.description)}">${esc(opt.icon)} ${esc(opt.label)}</button>`).join('')}</div>
    <div class="procResult" id="result-${p.pid}-${esc(getVmId(p)||'proc')}" style="display:none"></div>
  </div>`;
}

function captureClass(kind){return{DeepCapture:'btnDeep',Screenshot:'btnScreenshot',Migrate:'btnMigrate',Pause:'btnPause',Snapshot:'btnSnapshot',Metadata:'btnMeta'}[kind]||'';}
function getVmId(p){return p.kind&&p.kind.AeonVM&&p.kind.AeonVM.vm_id;}
function getProcessIcon(p){
  if(p.kind&&p.kind.AeonVM)return'⬡';
  const appId=p.kind&&p.kind.KnownApp&&p.kind.KnownApp.app_id;
  return({ 'claude-desktop':'💬',vscode:'📝',chrome:'🌐',firefox:'🌐',obsidian:'🗒',office:'📄' }[appId])||'□';
}
processList.addEventListener('click',e=>{
  const btn=e.target.closest('.captureBtn');
  if(!btn)return;
  executeCaptureOption(Number(btn.dataset.pid),btn.dataset.option,btn.dataset.label,btn.closest('.procItem'));
});
async function executeCaptureOption(pid,optionId,label,item){
  const resultEl=item.querySelector('.procResult');
  resultEl.style.display='block';
  resultEl.innerHTML=`<span>正在${esc(label)}...</span>`;
  let target_device=null;
  if(optionId.startsWith('migrate_')){
    target_device=await selectTargetDevice();
    if(!target_device){resultEl.style.display='none';return;}
  }
  try{
    const data=await fetch('/api/capture-process',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pid,option_id:optionId,target_device})}).then(r=>r.json());
    showCaptureResult(resultEl,data,label);
  }catch(err){
    showCaptureResult(resultEl,{ok:false,error:'请求失败'},label);
  }
}
function showCaptureResult(el,data,label){
  if(data.ok){
    el.innerHTML=`<div class="captureSuccess">✓ ${esc(label)}完成 ${data.cid?`<span class="cid">CID ${esc(data.cid.slice(0,8))}…</span>`:''}<span>${esc(data.message||'')}</span></div>`;
    refreshEntries();
    if(data.cid)setTimeout(()=>openEntry(data.cid),600);
    setTimeout(()=>{el.style.display='none';},3600);
  }else{
    el.innerHTML=`<div class="captureError">✗ ${esc(data.error||'操作失败')}</div>`;
    setTimeout(()=>{el.style.display='none';},5200);
  }
}
async function selectTargetDevice(){
  await refreshStatus();
  const online=devices.filter(d=>d.online&&!d.is_local&&d.id!=='local');
  if(!online.length){
    showToast('未检测到在线设备，将通过 AEON Relay 投递');
    return 'aeon-relay';
  }
  if(online.length===1)return online[0].id;
  const names=online.map((d,i)=>`${i+1}. ${d.name}`).join('\n');
  const idx=prompt(`选择目标设备：\n${names}\n\n输入序号:`);
  const i=Number.parseInt(idx,10)-1;
  return i>=0&&i<online.length?online[i].id:null;
}

function renderDevices(){
  if(!deviceList)return;
  renderConnectUrls();
  const onlineCount = (devices||[]).filter(d=>d.online).length;
  const deviceCount = document.getElementById('deviceCount');
  if(deviceCount) deviceCount.textContent = `ONLINE: ${onlineCount} / TOTAL: ${(devices||[]).length}`;
  deviceList.innerHTML=(devices||[]).map(d=>{
    const nameColor = getColor(d.name, 90, 75);
    const idColor = getColor(d.id || 'dev', 80, 65);
    return `
    <div class="deviceRow">
      <div>
        <strong style="color: ${nameColor};">${esc(d.name)}</strong>
        <div class="procExe" style="margin-top: 4px; color: var(--muted);">${esc(d.kind||'device')} · <span style="color: ${idColor};">${esc(d.id||'')}</span>${d.last_seen_ms&&!d.is_local?` · <span>${Math.round(d.last_seen_ms/1000)}s ago</span>`:''}</div>
      </div>
      <span class="badge ${d.online ? 'badge-ProcessState' : 'badge-Offline'}" style="color: ${d.online ? 'var(--green)' : 'var(--muted)'}">${d.online?'在线':'离线'}</span>
    </div>`;
  }).join('')||'<div class="empty">没有设备</div>';
}
function renderConnectUrls(){
  if(!connectList)return;
  connectList.innerHTML=(connectUrls||[]).map(c=>{
    const labelColor = getColor(c.label, 90, 70);
    return `
    <div class="connectRow">
      <span class="badge" style="width: fit-content; color: ${labelColor}; border-color: ${labelColor};">${esc(c.label)}${c.remote?' · Relay':''}</span>
      <span class="connectUrl">${esc(c.url)}</span>
      <button class="captureBtn btnMeta" data-copy-url="${esc(c.url)}" style="padding: 4px 10px; font-size: 11px;">复制</button>
    </div>`;
  }).join('')||'<div class="empty">没有连接地址</div>';
}
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-copy-url]');
  if(!btn)return;
  navigator.clipboard?.writeText(btn.dataset.copyUrl);
  showToast('连接地址已复制');
});
async function openVmPicker(){
  vmModal.classList.add('show');
  vmList.innerHTML='<div class="empty" style="height:160px"><div style="font-size: 14px; font-weight: 800; color: var(--muted); margin-bottom: 8px;">READING AEON VMS...</div><div style="font-size: 11px; color: var(--muted);">WAIT A MOMENT</div></div>';
  vms=await fetch('/api/vms').then(r=>r.json());
  renderVms();
  vmSearch.focus();
}
function closeVmPicker(){vmModal.classList.remove('show');}
function renderVms(){
  const q=vmSearch.value.trim().toLowerCase();
  const list=vms.filter(v=>!q||[v.id,v.status,v.program_path,v.program_id].some(x=>(x||'').toLowerCase().includes(q))).slice(0,240);
  vmList.innerHTML=list.map(v=>{
    const idColor = getColor(v.id, 90, 75);
    const pathColor = getColor(v.program_path || 'path', 70, 55);
    return `
    <div class="procItem">
      <div class="procMain"><span class="procIcon" style="color: ${idColor}">⬡</span><div class="procInfo"><div class="procName" style="color: ${idColor}">${esc(v.id)} · <span style="color: var(--green);">${esc(v.status)}</span></div><div class="procExe" style="color: ${pathColor}">${esc(v.program_path)}${v.error?' · <span style="color: var(--red);">'+esc(v.error)+'</span>':''}</div></div></div>
      <div class="procActions"><button class="captureBtn btnSnapshot" ${v.error?'disabled':''} onclick="captureVm('${esc(v.id)}')">💾 捕获快照</button></div>
    </div>`;
  }).join('')||'<div class="empty" style="height:160px">没有找到 AEON VM</div>';
}
async function captureVm(id){
  const result=await fetch(`/api/capture/vm/${encodeURIComponent(id)}`,{method:'POST'}).then(r=>r.ok?r.json():Promise.reject(r));
  closeVmPicker();
  await refreshEntries();
  setActiveKind('VmSnapshot');
  showToast(`已捕获 VM 快照 ${id}`);
  await openEntry(result.cid);
}
async function captureProcesses(){
  const result=await fetch('/api/capture/processes',{method:'POST'}).then(r=>r.json());
  await refreshEntries();
  if(result.ok&&result.cid){showToast(`已捕获 ${result.process_count||0} 个进程`);setActiveKind('ProcessState');await openEntry(result.cid);}
  else showToast(result.error||'进程清单捕获失败');
}
async function captureAll(){
  const result=await fetch('/api/capture/all',{method:'POST'}).then(r=>r.json());
  const captured=result.captured||[];
  await refreshEntries();
  if(captured.length){showToast(`已捕获全机状态：${result.process_count||0} 个进程，${Math.max(captured.length-1,0)} 个深度应用`);setActiveKind('all');await openEntry(captured[0]);}
  else showToast((result.errors&&result.errors[0])||'全机状态捕获失败');
}
async function captureApps(){
  const result=await fetch('/api/capture/apps',{method:'POST'}).then(r=>r.json());
  const captured=result.captured||[];
  await refreshEntries();
  if(captured.length){showToast(`已捕获 ${captured.length} 个应用`);await openEntry(captured[0]);}
  else showToast('没有检测到可捕获的应用状态');
}
async function captureDroppedFiles(files){const form=new FormData();for(const file of files)form.append('file',file,file.name);if(!files.length)return;await fetch('/api/capture/drop',{method:'POST',body:form});await refreshEntries();}
let dragDepth=0;
window.addEventListener('dragenter',e=>{e.preventDefault();dragDepth++;dropOverlay.classList.add('show');});
window.addEventListener('dragover',e=>{e.preventDefault();});
window.addEventListener('dragleave',e=>{dragDepth=Math.max(0,dragDepth-1);if(dragDepth===0)dropOverlay.classList.remove('show');});
window.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;dropOverlay.classList.remove('show');captureDroppedFiles([...e.dataTransfer.files]);});
pills.onclick=e=>{const b=e.target.closest('.pill');if(!b)return;setActiveKind(b.dataset.kind);};
search.oninput=renderStream;
procSearch.oninput=filterProcesses;
vmSearch.oninput=renderVms;
function setupWS(){const ws=new WebSocket(`ws://${location.host}/ws`);ws.onmessage=e=>{try{const msg=JSON.parse(e.data);if(msg.type==='capture'&&msg.entry){entries=[msg.entry,...entries.filter(x=>x.cid!==msg.entry.cid)];renderStream();return;}}catch{}refreshEntries();};ws.onclose=()=>setTimeout(setupWS,1500);}

refreshStatus();refreshEntries();setupWS();updateClock();
setInterval(()=>refreshStatus().catch(()=>{}),10000);
setInterval(updateClock,1000);
</script>
