[package]
name = "aeon-capture"
version = "0.1.0"
edition = "2021"

[dependencies]
aeon-store = { path = "../aeon-store" }
bincode = "1.3"
blake3 = "1.5"
dirs = "5"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
