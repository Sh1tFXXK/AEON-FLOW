[package]
name = "aeon-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aeon-agent"
path = "src/main.rs"

[dependencies]
aeon-store = { path = "../aeon-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "6"
mdns-sd = "0.11"
hex = "0.4"
dirs = "5"
tracing = "0.1"
tracing-subscriber = "0.3"
automerge = "0.5"
blake3 = "1.5"

[dev-dependencies]
tempfile = "3"
