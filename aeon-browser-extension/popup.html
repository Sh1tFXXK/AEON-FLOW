<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AEON</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font: 13px Arial, sans-serif;
        color: #111827;
        background: #ffffff;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      label {
        display: block;
        margin: 10px 0 5px;
        color: #4b5563;
      }
      input,
      select,
      button {
        box-sizing: border-box;
        width: 100%;
        min-height: 32px;
        font: inherit;
      }
      input,
      select {
        border: 1px solid #d1d5db;
        padding: 6px 8px;
      }
      button {
        margin-top: 10px;
        border: 0;
        background: #2563eb;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: #374151;
      }
      #status {
        min-height: 18px;
        margin-top: 10px;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <h1>AEON Vault</h1>
    <label for="password">Master password</label>
    <input id="password" type="password" autocomplete="current-password">
    <label for="ttl">Unlock duration</label>
    <select id="ttl">
      <option value="300000">5 minutes</option>
      <option value="900000">15 minutes</option>
      <option value="1800000">30 minutes</option>
    </select>
    <button id="unlock">Unlock</button>
    <button id="fill" class="secondary">Fill Current Page</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
