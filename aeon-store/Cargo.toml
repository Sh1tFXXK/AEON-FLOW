[package]
name = "aeon-store"
version = "0.1.0"
edition = "2021"

[dependencies]
blake3 = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
dirs = "5"

[[bin]]
name = "aeon-data"
path = "src/bin/aeon-data.rs"
