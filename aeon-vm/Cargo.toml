[package]
name = "aeon-vm"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "aeon-run"
path = "src/main.rs"

[[bin]]
name = "aeon-asm"
path = "src/bin/aeon-asm.rs"

[[bin]]
name = "aeon-recv"
path = "src/bin/aeon-recv.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
blake3 = "1.5"
